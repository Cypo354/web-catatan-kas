<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catatan Kas - Home</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/svg+xml" href="icon/logo.svg">
  <link rel="manifest" href="manifest.json">
</head>
<body>

  <div class="container">
    <h2>Catatan Kas</h2>
    <div id="storage-status" style="font-size: 12px; color: var(--text-muted); margin-bottom: 12px;">
      Status Storage: Memuat.......
    </div>

    <!-- Kartu Total Saldo Utama -->
    <div class="card main-card">
      <small>Total Kas</small>
      <h1 id="total-saldo">Rp 0</h1>
    </div>

    <!-- Ringkasan Kantong Kas -->
    <h3>Ringkasan Kantong</h3>
    <div id="kantong-list" class="kantong-grid">
      <!-- Di-render otomatis oleh app-index.js -->
    </div>

    <!-- Form Tambah Transaksi -->
    <div class="card">
      <h3>Tambah Transaksi</h3>
      <form id="form-transaksi">
        <div>
          <label>Tipe Transaksi</label>
          <select id="tipe-transaksi">
            <option value="pemasukan">Pemasukan (+)</option>
            <option value="pengeluaran" selected>Pengeluaran (-)</option>
          </select>
        </div>

        <div id="wrapper-select-kategori">
          <label>Pilih Kantong Kas</label>
          <select id="select-kategori">
            <option value="">-- Pilih Kantong Kas --</option>
          </select>
        </div>

        <div>
          <label>Deskripsi</label>
          <input type="text" id="ket-transaksi" placeholder="Contoh: Gaji / Belanja Harian">
        </div>

        <div>
          <label>Nominal (Rp)</label>
          <input type="number" id="jumlah-transaksi" placeholder="0" min="0">
        </div>

        <button type="submit" class="btn-primary">Simpan Transaksi</button>
      </form>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-btn active"><span>Home</span></a>
    <a href="analytics.html" class="nav-btn"><span>Riwayat</span></a>
    <a href="settings.html" class="nav-btn"><span>Setting</span></a>
  </nav>

  <script src="storage.js"></script>
  <script src="app-index.js"></script>
</body>
</html>
